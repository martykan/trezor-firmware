
syntax = "proto2";
package hw.trezor.messages.cashu;

// Sugar for easier handling in Java
option java_package = "com.satoshilabs.trezor.lib.protobuf";
option java_outer_classname = "TrezorMessageCashu";

/** Cashu types from CDK signatory.proto */

enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_MINT = 1;
    OPERATION_MELT = 2;
    OPERATION_SWAP = 3;
}

message BlindedMessage {
    required uint64 amount = 1;
    required bytes keyset_id = 2;
    required bytes blinded_secret = 3;
}

message SignatoryKeysets {
    required bytes pubkey = 1;
    repeated KeySet keysets = 2;
}

message KeySet {
    required bytes id = 1;
    required CurrencyUnit unit = 2;
    required bool active = 3;
    required uint64 input_fee_ppk = 4;
    required Keys keys = 5;
    optional uint64 final_expiry = 6;
    required uint64 version = 7;
}

message Keys {
  map<uint64, bytes> keys = 1;
}

enum CurrencyUnitType {
  CURRENCY_UNIT_TYPE_UNSPECIFIED = 0;
  CURRENCY_UNIT_TYPE_SAT = 1;
  CURRENCY_UNIT_TYPE_MSAT = 2;
  CURRENCY_UNIT_TYPE_USD = 3;
  CURRENCY_UNIT_TYPE_EUR = 4;
  CURRENCY_UNIT_TYPE_AUTH = 5;
}

message CurrencyUnit {
  oneof currency_unit {
    CurrencyUnitType unit = 1;
    string custom_unit = 2;
  }
}

message Proofs {
  repeated Proof proof = 1;
  required Operation operation = 3;
  required string correlation_id = 4;
}

message Proof {
  required uint64 amount = 1;
  required bytes keyset_id = 2;
  required bytes secret = 3;
  required bytes c = 4;
}

message BlindSignature {
  required uint64 amount = 1;
  required bytes keyset_id = 2;
  required bytes blinded_secret = 3;
  optional BlindSignatureDLEQ dleq = 4;
}

message BlindSignatureDLEQ {
  required bytes e = 1;
  required bytes s = 2;
}

enum CashuErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_AMOUNT_OUTSIDE_LIMIT = 1;
  ERROR_CODE_DUPLICATE_INPUTS_PROVIDED = 2;
  ERROR_CODE_DUPLICATE_OUTPUTS_PROVIDED = 3;
  ERROR_CODE_KEYSET_NOT_KNOWN = 4;
  ERROR_CODE_KEYSET_INACTIVE = 5;
  ERROR_CODE_MINTING_DISABLED = 6;
  ERROR_CODE_COULD_NOT_ROTATE_KEYSET = 7;
  ERROR_CODE_INVALID_PROOF = 8;
  ERROR_CODE_INVALID_BLIND_MESSAGE = 9;
  ERROR_CODE_UNIT_NOT_SUPPORTED = 10;
}

/**
 * Request: Cashu blind sign request
 * @start
 * @next CashuBlindSignResponse
 * @next Failure
 */
message CashuBlindSign {
  repeated BlindedMessage blinded_messages = 1;
  required Operation operation = 2;
  optional string correlation_id = 3;
}

/**
 * Response: Cashu blind sign response
 * @end
 */
message CashuBlindSignResponse {
    repeated BlindSignature sigs = 1;
}

/**
 * Request: Cashu verify proofs request
 * @start
 * @next Success
 * @next Failure
 */
message CashuVerifyProofs {
    required Proofs proofs = 1;
}

/**
 * Request: Cashu get keysets request
 * @start
 * @next CashuGetKeysetsResponse
 * @next Failure
 */
message CashuGetKeysets {
}

/**
 * Response: Cashu get keysets response
 * @end
 */
message CashuGetKeysetsResponse {
    required SignatoryKeysets keysets = 1;
}

/**
 * Request: Cashu rotate keyset request
 * @start
 * @next CashuRotateKeysetResponse
 * @next Failure
 */
message CashuRotateKeyset {
    required CurrencyUnit unit = 1;
    required uint64 input_fee_ppk = 2;
    repeated uint64 amounts = 3;
}

/**
 * Response: Cashu rotate keyset response
 * @end
 */
message CashuRotateKeysetResponse {
    required KeySet keyset = 1;
}
